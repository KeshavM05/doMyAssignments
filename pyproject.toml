[project]
name = "onq-autopilot"
version = "0.1.0"
description = "Automated D2L/OnQ assignment fetcher and LLM completion pipeline"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    # Browser automation (SSO login + scraping)
    "playwright>=1.44",
    # LLM providers (install whichever you use)
    "openai>=1.30",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "boto3>=1.34",
    # File extraction
    "pdfplumber>=0.10",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
